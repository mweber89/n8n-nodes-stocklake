name: Publish to npm

# Manual trigger only — a verified n8n community node is expected to be
# published deliberately, per a version bump, not on every push to main.
# Requires npm provenance (mandatory for n8n-verified nodes since 2026-05-01),
# which needs this workflow to run with `id-token: write` and the repo's npm
# publishing configured for GitHub Actions as a trusted publisher (or a
# short-lived Granular Access Token stored as the NPM_TOKEN secret).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify with n8n's own community-package scanner
        # @n8n/scan-community-package fetches the package BY NAME from the
        # npm registry — it has no local-directory mode, so this can only
        # meaningfully run post-publish, not as a pre-publish gate. This is
        # the real, official pre-Creator-Portal-submission check (provenance
        # + the same static analysis rules `npm run lint` already runs
        # locally, but against what's actually live on npm, not the working
        # tree). A short sleep first: registry propagation for a fresh,
        # provenance-attested publish isn't always instant. The tool prints
        # a pass/fail report but always exits 0 (confirmed empirically —
        # don't rely on its exit code), so this step is deliberately
        # informational, not a workflow-failing gate; read the log.
        run: |
          sleep 20
          npx --yes @n8n/scan-community-package n8n-nodes-stocklake
